name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests ../api
      - run: ruff check app tests ../api
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t winddesk:ci .
      - name: Smoke test
        run: |
          docker run -d --name winddesk -p 8000:8000 winddesk:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 1; done
          curl -fsS "http://localhost:8000/api/briefing?deliveryDate=2026-01-15" > /dev/null
          curl -fsS http://localhost:8000/briefing | grep -q '<div id="root">'
          docker rm -f winddesk
